
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE | Login</title>

    <link rel="stylesheet" href="/static/forms.css">
</head>

<body class="login-page">
<header>
    <h1>SYNAPSE</h1>
</header>

<main>
    <section class="card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Log in to your shared workspace</p>

        <form id="login-form">
            <div class="group">
                <label for="username">Username</label>
                <input
                    id="username"
                    type="text"
                    minlength="3"
                    maxlength="40"
                    autocomplete="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="group">
                <label for="email">Registered Email</label>
                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <button class="primary" id="send-button" type="submit">
                Send Email OTP
            </button>

            <div id="otp-section" class="hidden">
                <div class="group otp-group">
                    <label for="otp">Enter 6-digit OTP</label>
                    <input
                        id="otp"
                        type="text"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        placeholder="Enter OTP from email"
                        required
                    >
                </div>

                <button class="primary" id="verify-button" type="button">
                    Verify OTP & Login
                </button>
            </div>
        </form>
        <div class="footer">
            Dont have a account?
            <a href="/register-page">register here</a>
        </div>
        <p id="message" role="status" aria-live="polite"></p>
    </section>
</main>

<script>
    const form = document.getElementById("login-form");
    const usernameInput = document.getElementById("username");
    const emailInput = document.getElementById("email");
    const otpInput = document.getElementById("otp");
    const otpSection = document.getElementById("otp-section");
    const sendButton = document.getElementById("send-button");
    const verifyButton = document.getElementById("verify-button");
    const message = document.getElementById("message");

    otpInput.disabled = true;
    otpInput.required = false;

    let otpSent = false;

    function showMessage(text, type = "") {
        message.textContent = text;
        message.className = type;
    }

    async function post(path, body) {
        const response = await fetch(path, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
        });

        const responseText = await response.text();
        let data = {};

        if (responseText) {
            try {
                data = JSON.parse(responseText);
            } catch {
                if (!response.ok) {
                    throw new Error(`Request failed (HTTP ${response.status}).`);
                }

                throw new Error("The server returned an invalid response.");
            }
        }

        if (!response.ok) {
            const detail = Array.isArray(data.detail)
                ? data.detail.map((issue) => issue.msg).join(" ")
                : data.detail;

            throw new Error(detail || `Request failed (HTTP ${response.status}).`);
        }

        return data;
    }

    // Step 1: Verify the registered username and email before sending OTP
    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        if (otpSent) return;

        sendButton.disabled = true;
        showMessage("Checking username and email...");

        try {
            const data = await post("/send-otp", {
                username: usernameInput.value.trim(),
                email: emailInput.value.trim(),
            });

            otpSent = true;
            usernameInput.readOnly = true;
            emailInput.readOnly = true;

            otpSection.classList.remove("hidden");
            otpInput.disabled = false;
            otpInput.required = true;
            sendButton.classList.add("hidden");

            showMessage(data.message, "success");
            otpInput.focus();

        } catch (error) {
            showMessage(error.message, "error");
        } finally {
            sendButton.disabled = false;
        }
    });

    // Step 2: Verify OTP
    verifyButton.addEventListener("click", async function () {
        if (!otpInput.reportValidity()) return;

        verifyButton.disabled = true;
        showMessage("Verifying OTP...");

        try {
            const data = await post("/verify-otp", {
                username: usernameInput.value.trim(),
                email: emailInput.value.trim(),
                otp: otpInput.value.trim()
            });

            showMessage(
                data.message + " Welcome, " + data.username + "!",
                "success"
            );

            sessionStorage.setItem("username", data.username);
            window.location.href = "/workspace-page";

        } catch (error) {
            showMessage(error.message, "error");
        } finally {
            verifyButton.disabled = false;
        }
    });
</script>
</body>
</html>
