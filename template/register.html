
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE | Register</title>

    <link rel="stylesheet" href="/static/forms.css">
</head>

<body class="register-page">
<header>
    <h1>SYNAPSE</h1>
</header>

<main>
    <section class="card">
        <h2>Create Account</h2>
        <p class="subtitle">
            Register your details for the shared workspace
        </p>

        <form id="registration-form">
            <div class="group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    minlength="3"
                    maxlength="40"
                    autocomplete="username"
                    placeholder="Choose a username"
                    required
                >
            </div>

            <div class="group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    placeholder="Enter your email address"
                    required
                >
            </div>

            <button
                type="button"
                class="primary"
                id="send-otp-button"
            >
                Send Email OTP
            </button>
            <div id="otp-section" class="hidden">
        <div class="group otp-group">
            <label for="otp">Email Verification OTP</label>
            <input
                type="text"
                id="otp"
                name="otp"
                inputmode="numeric"
                autocomplete="one-time-code"
                pattern="[0-9]{6}"
                maxlength="6"
                placeholder="Enter 6-digit OTP"
                disabled
            >
        </div>

        <button
            type="button"
            class="primary"
            id="verify-button"
        >
            Verify OTP & Register
        </button>
        </div>
            <div id="otp-section" class="hidden">
                <div class="group otp-group">
                    <label for="otp">Email Verification OTP</label>
                    <input
                        type="text"
                        id="otp"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        placeholder="Enter 6-digit OTP"
                        disabled
                    >
                </div>

                <button
                    type="button"
                    class="primary"
                    id="verify-button"
                >
                    Verify OTP & Register
                </button>
            </div>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <div class="footer">
            Already have an account?
            <a href="/login-page">Login here</a>
        </div>
    </section>
</main>


<script>
    const API = "http://127.0.0.1:8000";

    const form = document.getElementById("registration-form");
    const username = document.getElementById("username");
    const email = document.getElementById("email");
    const otp = document.getElementById("otp");

    const sendButton = document.getElementById("send-otp-button");
    const verifyButton = document.getElementById("verify-button");
    const otpSection = document.getElementById("otp-section");
    const message = document.getElementById("message");

    otp.disabled = true;
    otp.required = false;

    let otpSent = false;

    function showMessage(text, type = "") {
        message.textContent = text;
        message.className = type;
    }

    async function postData(endpoint, data) {
        const response = await fetch(API + endpoint, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(result.detail || "Something went wrong.");
        }

        return result;
    }

    function getRegistrationData() {
        return {
            username: username.value.trim(),
            email: email.value.trim()
        };
    }

    // Step 1: Request email OTP
    sendButton.addEventListener("click", async () => {
        if (otpSent || !form.reportValidity()) return;

        sendButton.disabled = true;
        showMessage("Sending verification OTP...");

        try {
            const result = await postData(
                "/registration/send-otp",
                getRegistrationData()
            );

            otpSent = true;
            username.readOnly = true;
            email.readOnly = true;

            // Show the OTP input and verification button
            otpSection.classList.remove("hidden");
            otpSection.style.display = "block";

            otp.disabled = false;
            otp.required = true;

            // Hide the Send OTP button after successful sending
            sendButton.style.display = "none";

            showMessage(
                result.message || "OTP sent! Check your email.",
                "success"
            );

            otp.focus();

        } catch (error) {
            showMessage(error.message, "error");
        } finally {
            sendButton.disabled = false;
        }
    });

    // Step 2: Verify OTP and finish registration
    verifyButton.addEventListener("click", async () => {
        if (!otp.reportValidity()) return;

        verifyButton.disabled = true;
        showMessage("Verifying email...");

        try {
            const result = await postData(
                "/registration/verify-otp",
                {
                    ...getRegistrationData(),
                    otp: otp.value.trim()
                }
            );

            showMessage(
                result.message || "Registration successful!",
                "success"
            );

            setTimeout(() => {
                window.location.href = "/login-page";
            }, 1200);

        } catch (error) {
            showMessage(error.message, "error");
        } finally {
            verifyButton.disabled = false;
        }
    });
</script>

</body>
</html>
