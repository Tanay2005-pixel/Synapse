
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE | Login</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        header {
            background: #d62828;
            color: white;
            text-align: center;
            padding: 18px;
        }

        header h1 {
            margin: 0;
            letter-spacing: 4px;
        }

        main {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px #00000017;
        }

        h2 { text-align: center; }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .group { margin-bottom: 17px; }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #d62828;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .primary:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 16px;
            text-align: center;
            line-height: 1.5;
        }

        .error { color: #b71f1f; }
        .success { color: #18733b; }
        .hidden { display: none; }
    </style>
</head>

<body>
<header>
    <h1>SYNAPSE</h1>
</header>

<main>
    <section class="card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Log in to your shared workspace</p>

        <form id="login-form">
            <div class="group">
                <label for="email">Registered Email</label>
                <input
                    id="email"
                    type="email"
                    autocomplete="username"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="group">
                <label for="password">Password</label>
                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button class="primary" id="send-button" type="submit">
                Verify Credentials & Send OTP
            </button>

            <div id="otp-section" class="hidden">
                <div class="group" style="margin-top: 20px;">
                    <label for="otp">Enter 6-digit OTP</label>
                    <input
                        id="otp"
                        type="text"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        placeholder="Enter OTP from email"
                        required
                    >
                </div>

                <button class="primary" id="verify-button" type="button">
                    Verify OTP & Login
                </button>
            </div>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
    </section>
</main>

<script>
    const API = "http://127.0.0.1:8000";

    const form = document.getElementById("login-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const otpInput = document.getElementById("otp");
    const otpSection = document.getElementById("otp-section");
    const sendButton = document.getElementById("send-button");
    const verifyButton = document.getElementById("verify-button");
    const message = document.getElementById("message");

    let otpSent = false;

    function showMessage(text, type = "") {
        message.textContent = text;
        message.className = type;
    }

    async function post(path, body) {
        const response = await fetch(API + path, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(data.detail || "Request failed.");
        }

        return data;
    }

    // Step 1: Verify email and password before sending OTP
    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        if (otpSent) return;

        sendButton.disabled = true;
        showMessage("Checking email and password...");

        try {
            const data = await post("/send-otp", {
                email: emailInput.value.trim(),
                password: passwordInput.value
            });

            otpSent = true;
            emailInput.readOnly = true;
            passwordInput.readOnly = true;

            otpSection.classList.remove("hidden");
            sendButton.classList.add("hidden");

            showMessage(data.message, "success");
            otpInput.focus();

        } catch (error) {
            showMessage(error.message, "error");
        } finally {
            sendButton.disabled = false;
        }
    });

    // Step 2: Verify OTP
    verifyButton.addEventListener("click", async function () {
        if (!otpInput.reportValidity()) return;

        verifyButton.disabled = true;
        showMessage("Verifying OTP...");

        try {
            const data = await post("/verify-otp", {
                email: emailInput.value.trim(),
                otp: otpInput.value.trim()
            });

            showMessage(
                data.message + " Welcome, " + data.username + "!",
                "success"
            );

            // Redirect to the workspace here after implementing
            // a proper authenticated session.

        } catch (error) {
            showMessage(error.message, "error");
        } finally {
            verifyButton.disabled = false;
        }
    });
</script>
</body>
</html>
